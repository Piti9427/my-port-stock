name: Enterprise QA and Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: enterprise-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - name: Initialize advisory CodeQL
        id: codeql-init
        continue-on-error: true
        uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          languages: javascript-typescript
      - run: node scripts/run-ci-gate.js format "Format" "npm run check:format"
      - run: node scripts/run-ci-gate.js lint "Lint" "npm run check:lint"
      - run: node scripts/run-ci-gate.js typecheck "Full-repo JavaScript typecheck" "npm run check:type"
      - run: node scripts/run-ci-gate.js build "Production build" "npm run check:build"
      - name: Analyze advisory CodeQL
        if: always() && steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gates-quality
          if-no-files-found: ignore
          path: artifacts/gate-reports/*.json

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --requirement requirements-ci.txt
      - name: Node tests
        run: node scripts/run-ci-gate.js node-tests "Node tests" "npm run check:unit"
      - name: Python quant tests
        run: node scripts/run-ci-gate.js python-tests "Python quant tests" "npm run check:python"
      - name: Financial property tests
        run: node scripts/run-ci-gate.js property-tests "Financial property tests" "npm run check:property"
      - name: Advisory coverage baseline
        if: always()
        continue-on-error: true
        run: npm run check:coverage
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gates-tests
          if-no-files-found: ignore
          path: artifacts/gate-reports/*.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-failure-evidence
          if-no-files-found: ignore
          path: |
            artifacts/reports/coverage
            artifacts/reports/*.log
            test-results

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - name: Empty migration replay and pgTAP
        run: |
          mkdir -p artifacts/reports
          set -o pipefail
          node scripts/run-ci-gate.js database "Supabase migration and RLS" "npm run check:database"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gates-database
          if-no-files-found: ignore
          path: artifacts/gate-reports/*.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-failure-evidence
          if-no-files-found: ignore
          path: artifacts/reports/database.log

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-ci-gate.js e2e "Deterministic E2E and accessibility" "npm run check:e2e"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gates-e2e
          if-no-files-found: ignore
          path: artifacts/gate-reports/*.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-evidence
          if-no-files-found: ignore
          path: |
            artifacts/reports/playwright
            artifacts/reports/e2e.log
            test-results

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
      - name: Install checksum-verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Authoritative redacted PR-history scan
        run: node scripts/run-ci-gate.js secrets "Secret scan" "npm run check:secrets"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gates-secrets
          if-no-files-found: ignore
          path: artifacts/gate-reports/*.json

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - name: Block high and critical production vulnerabilities
        run: node scripts/run-ci-gate.js dependency-security "Production dependency security" "npm run check:dependencies"
      - name: Advisory development dependency audit
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-gates-dependency-security
          if-no-files-found: ignore
          path: artifacts/gate-reports/*.json

  report:
    name: assurance-report
    if: always()
    needs: [quality, tests, database, e2e, secrets, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-gates-*
          path: artifacts/gate-reports
          merge-multiple: true
      - run: node scripts/merge-ci-reports.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-check-report
          path: artifacts/reports/pr-check-report.json
